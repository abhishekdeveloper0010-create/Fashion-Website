   <script>
        fetch("../header/header.html")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Header file not found: " + response.status);
                }
                return response.text();
            })
            .then(data => {
                document.getElementById("header").innerHTML = data;

            });
